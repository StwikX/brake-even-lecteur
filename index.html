<!doctype html>
<!--
	Brake Even — le lecteur YouTube du cinéma et des boombox (docs/v1.md, 7 quater, point 8).
	À héberger tel quel (GitHub Pages, par exemple), puis donner son adresse à
	EconomyConfig.MediaYouTubePage. Le jeu charge : <adresse>?v=<identifiant>&t=<secondes>&vol=<0 à 100>.
	Le lecteur officiel (IFrame API) n'est ni modifié ni masqué : c'est ce qu'exigent les règles
	de YouTube, et sans page hôte le lecteur refuse de démarrer (erreur 153).
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<title>Brake Even · player</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
		#lecteur { width: 100%; height: 100%; }
	</style>
</head>
<body>
	<div id="lecteur"></div>
	<script>
		var q = new URLSearchParams( location.search );
		var id = ( q.get( "v" ) || "" ).replace( /[^A-Za-z0-9_-]/g, "" ).slice( 0, 11 );
		var debut = Math.max( 0, Math.floor( parseFloat( q.get( "t" ) || "0" ) || 0 ) );
		// Le volume du réglage « Cinéma et boombox » du joueur, de 0 à 100.
		var volume = Math.min( 100, Math.max( 0, parseInt( q.get( "vol" ) || "80", 10 ) || 0 ) );
		var api = document.createElement( "script" );
		api.src = "https://www.youtube.com/iframe_api";
		document.head.appendChild( api );
		function onYouTubeIframeAPIReady() {
			new YT.Player( "lecteur", {
				videoId: id,
				playerVars: { autoplay: 1, start: debut, playsinline: 1, rel: 0 },
				events: { onReady: function ( e ) {
					if ( volume <= 0 ) e.target.mute(); else { e.target.unMute(); e.target.setVolume( volume ); }
					e.target.playVideo();
				} }
			} );
		}
	</script>
</body>
</html>
