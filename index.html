<!doctype html>
<!--
	Brake Even — le lecteur YouTube du cinéma et des boombox (docs/v1.md, 7 quater, point 8).
	Publiée le 2026-10-13 sur https://stwikx.github.io/brake-even-lecteur/ (dépôt StwikX/brake-even-lecteur) ; son adresse est dans
	EconomyConfig.MediaYouTubePage. Le jeu charge : <adresse>?v=<identifiant>&t=<secondes>&vol=<0 à 100>,
	puis change seulement la fin de l'adresse (#vol=<0 à 100>) quand le volume bouge : la distance du
	joueur à l'écran et son réglage. La page ne se recharge pas, elle règle le lecteur.
	Le lecteur officiel (IFrame API) n'est ni modifié ni masqué : c'est ce qu'exigent les règles
	de YouTube, et sans page hôte le lecteur refuse de démarrer (erreur 153).
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<title>Brake Even · player</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
		#lecteur { width: 100%; height: 100%; }
		/* Transparent : rien du lecteur n'est caché ; il reçoit le clic que le jeu envoie, pour le son. */
		#clic { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: transparent; }
	</style>
</head>
<body>
	<div id="lecteur"></div>
	<div id="clic"></div>
	<script>
		var q = new URLSearchParams( location.search );
		var id = ( q.get( "v" ) || "" ).replace( /[^A-Za-z0-9_-]/g, "" ).slice( 0, 11 );
		var debut = Math.max( 0, Math.floor( parseFloat( q.get( "t" ) || "0" ) || 0 ) );
		// Le volume du réglage « Cinéma et boombox » du joueur, de 0 à 100.
		var volume = Math.min( 100, Math.max( 0, parseInt( q.get( "vol" ) || "80", 10 ) || 0 ) );
		var api = document.createElement( "script" );
		api.src = "https://www.youtube.com/iframe_api";
		document.head.appendChild( api );
		var lecteur = null, clique = false;
		// Un navigateur ne lance une vidéo d'office qu'en muet : on part muet, et le premier clic
		// (envoyé par le jeu) rend le son, au volume du réglage du joueur.
		function sonner() {
			if ( !lecteur ) return;
			if ( volume <= 0 ) lecteur.mute(); else { lecteur.unMute(); lecteur.setVolume( volume ); }
			lecteur.playVideo();
		}
		document.getElementById( "clic" ).addEventListener( "mousedown", function () { clique = true; sonner(); } );
		// Le volume que le jeu envoie par la fin de l'adresse, sans recharger la page.
		function lireVolume() {
			var m = /vol=(\d+)/.exec( location.hash );
			if ( !m ) return;
			volume = Math.min( 100, Math.max( 0, parseInt( m[1], 10 ) || 0 ) );
			if ( !lecteur || !clique ) return;
			if ( volume <= 0 ) lecteur.mute(); else { lecteur.unMute(); lecteur.setVolume( volume ); }
		}
		window.addEventListener( "hashchange", lireVolume );
		function onYouTubeIframeAPIReady() {
			lecteur = new YT.Player( "lecteur", {
				videoId: id,
				playerVars: { autoplay: 1, mute: 1, start: debut, playsinline: 1, rel: 0 },
				events: { onReady: function ( e ) {
					e.target.mute();
					e.target.playVideo();
					if ( clique ) sonner();
				} }
			} );
		}
	</script>
</body>
</html>
